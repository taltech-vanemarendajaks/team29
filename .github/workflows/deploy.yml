name: CI/CD Pipeline

on:
  push:
    branches: [ "hw03-attempt" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # --------------------------
      # Build & Push Backend Image
      # --------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend-tiim29:latest ./backend

      - name: Push backend image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend-tiim29:latest

      # --------------------------
      # Build & Push Frontend Image
      # --------------------------
      - name: Build frontend image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend-tiim29:latest ./frontend

      - name: Push frontend image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend-tiim29:latest

      # --------------------------
      # Deploy to Server
      # --------------------------
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOYMENT_VM_HOST }}
          username: ${{ secrets.DEPLOYMENT_VM_USER }}
          key: ${{ secrets.DEPLOYMENT_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOYMENT_VM_PORT }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/backend-tiim29:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/frontend-tiim29:latest
            cd /home/${{ secrets.DEPLOYMENT_VM_USER }}/borsibaar
            docker compose down
            docker compose up -d