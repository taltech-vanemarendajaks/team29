name: CI/CD Pipeline

on:
  push:
    branches: [ "hw03-attempt" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # --------------------------
      # Build & Push Backend Image
      # --------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build backend artifact
        working-directory: backend
        run: ./mvnw clean package -DskipTests

      - name: Build backend image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/borsibaar-backend:latest ./backend

      - name: Push backend image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/borsibaar-backend:latest

      # --------------------------
      # Build & Push Frontend Image
      # --------------------------
      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/borsibaar-frontend:latest \
            ./frontend

      - name: Push frontend image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/borsibaar-frontend:latest

      # --------------------------
      # Upload docker compose file
      # --------------------------
      - name: Upload docker-compose.yml
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DEPLOYMENT_VM_HOST }}
          username: ${{ secrets.DEPLOYMENT_VM_USER }}
          key: ${{ secrets.DEPLOYMENT_SSH_PRIVATE_KEY }}
          source: "docker-compose.yaml"
          target: "/home/${{ secrets.DEPLOYMENT_VM_USER }}/borsibaar/"

      # --------------------------
      # Deploy to Server
      # --------------------------
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOYMENT_VM_HOST }}
          username: ${{ secrets.DEPLOYMENT_VM_USER }}
          key: ${{ secrets.DEPLOYMENT_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEPLOYMENT_VM_PORT }}
          script: |
            export POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            export POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            export APP_FRONTEND_URL=${{ secrets.APP_FRONTEND_URL }}
            export NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export JWT_SECRET=${{ secrets.JWT_SECRET }}
            export GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            export GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            export APP_CORS_ALLOWED_ORIGINS=${{ secrets.APP_FRONTEND_URL }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/borsibaar-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/borsibaar-frontend:latest
            cd /home/${{ secrets.DEPLOYMENT_VM_USER }}/borsibaar
            docker compose down
            docker compose up -d